name: Build & Sync Nodes

on:
  push:
    branches: [main]
    paths:
      - 'nodes/**'
      - 'scripts/**'

  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build manifest
        run: node scripts/build-manifest.js

      - name: Update README table
        run: node scripts/update-readme.js

      - name: Commit manifest & README changes
        run: |
          git config user.name "Node Hunter Bot"
          git config user.email "bot@basitq.cloud"
          git add manifest.json README.md
          git diff --cached --quiet || {
            git pull origin main --rebase
            git commit -m "chore: update manifest & readme [skip ci]"
            git push
          }

      - name: Sync to Supabase
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node scripts/sync-to-supabase.js
